services:
  # 1. Umbrel 反向代理 (保持不变)
  app_proxy:
    environment:
      APP_HOST: tao-filebrowser_main_1
      APP_PORT: 80

  # 2. FileBrowser 应用服务
  main:
    image: 'filebrowser/filebrowser:latest'
    
    container_name: tao-filebrowser_main_1
    
    restart: always

    # 关键: 保持 '0:0' (root) 权限，以便管理宿主机上的文件
    user: '0:0'
    
    volumes:
      # [!!! 关键修改 !!!]
      # 将宿主机的 /mnt/data 目录映射到容器内的 /srv 目录
      - /mnt/data:/srv
      
      # Umbrel 的标准配置和数据库路径 (保持不变)
      - ${APP_DATA_DIR}/database:/database
      - ${APP_DATA_DIR}/config:/config
      
    expose:
      - "80"
