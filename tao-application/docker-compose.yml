services:
  app_proxy:
    environment:
      APP_HOST: tao-application_main_1
      APP_PORT: 80
    container_name: tao-application_app_proxy_1
  main:
    image: nginx:alpine
    container_name: tao-application_main_1
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR}/html:/usr/share/nginx/html:ro
    expose:
      - '80'
