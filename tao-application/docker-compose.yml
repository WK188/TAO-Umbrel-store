services:
  app_proxy:
    environment:
      # APP_HOST 必须指向 main 服务的容器名
      APP_HOST: tao-application_main_1
      APP_PORT: 80  # NGINX 内部端口是 80
  
  main:
    image: 'nginx:alpine'
    container_name: tao-application_main_1
    restart: always
    volumes:
      # 直接写死宿主机路径，避免 $APP_DATA_DIR 未设置导致挂载失败
      - /root/umbrel/umbrel/app-data/tao-application/html:/usr/share/nginx/html:ro
    expose:
      - "80"  # 仅暴露给内部的 app_proxy
